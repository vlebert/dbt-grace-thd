
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'grace_thd'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'grace_thd'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


vars:
  # Niveau de conteneur GRACE THD appliqué aux contrôles de remplissage
  # (valeurs attendues : C1, C2, C3, C4)
  grace_container_level: 'C3'

models:
  grace_thd:
    controls:
      +schema: controles
      generique:
        +materialized: table
        +tags: ['control']
      specifique:
        +materialized: table
        +tags: ['control']

seeds:
  grace_thd:
    listes:
      +schema: listes
      +column_types:
        code: varchar(254)
        libelle: varchar(254)
        definition: varchar(254)
    controls:
      +schema: seeds
      param_ctrl_fk:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          classe_cible: varchar(50)
          attribut_cible: varchar(50)
          actif: boolean
      param_ctrl_liste_valeur:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          table_liste: varchar(100)
          actif: boolean
      param_ctrl_unicite:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          actif: boolean
      param_ctrl_remplissage:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          conteneur_c1: varchar(1)
          conteneur_c2: varchar(1)
          conteneur_c3: varchar(1)
          conteneur_c4: varchar(1)
          actif: boolean
