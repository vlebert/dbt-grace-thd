
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'grace_thd'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'grace_thd'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


vars:
  # Niveau de conteneur GRACE THD appliqué aux contrôles de remplissage
  # (valeurs attendues : C1, C2, C3, C4)
  grace_container_level: 'C3'

  # Modèles de contrôle inclus dans rapport_controles (modèles du package)
  grace_ctrl_models:
    - ctrl_fk
    - ctrl_liste_valeur
    - ctrl_presence_table
    - ctrl_remplissage
    - ctrl_unicite
    - rc_0002_t_adresse_ad_codtemp
    - rc_0003_t_adresse_ad_distinf
    - rc_0013_t_cable_cb_r3_code
    - rc_0014_t_cassette_cs_bp_code
    - rc_0015_t_cheminement_cm_compo
    - rc_0018_t_local_lc_avct
    - rc_0020_t_local_lc_bp_codf
    - rc_0021_t_local_lc_bp_codp
    - rc_0022_t_local_lc_codeext
    - rc_0023_t_local_lc_dateins
    - rc_0024_t_local_lc_elec
    - rc_0027_t_local_lc_etiquet
    - rc_0028_t_local_lc_gest
    - rc_0029_t_local_lc_prop
    - rc_0030_t_local_lc_proptyp
    - rc_0031_t_local_lc_statut
    - rc_0041_t_pointaccueil_pa_a_haut
    - rc_0042_t_pointaccueil_pa_a_struc
    - rc_0045_t_pointaccueil_pa_codtemp
    - rc_0047_t_pointaccueil_pa_rotatio
    - rc_0059_t_site_st_ad_code
    - rc_0060_t_site_st_avct
    - rc_0061_t_site_st_codeext
    - rc_0062_t_site_st_commune
    - rc_0063_t_site_st_dateins
    - rc_0064_t_site_st_gest
    - rc_0065_t_site_st_insee
    - rc_0067_t_site_st_nomvoie
    - rc_0068_t_site_st_postal
    - rc_0069_t_site_st_prop
    - rc_0070_t_site_st_proptyp
    - rc_0073_t_site_st_statut
    - rc_0083_t_cable_cb_dateins
    - rc_0084_t_ebp_bp_dateins
    - rc_0085_t_local_lc_dateins
    - rc_0086_t_site_st_dateins
    - rc_0087_t_site_st_numero

  # Extensions utilisateur : ajouter ici les contrôles personnalisés
  grace_ctrl_models_ext: []

models:
  grace_thd:
    controls:
      +schema: controles
      generique:
        +materialized: table
        +tags: ['control']
      specifique:
        +materialized: table
        +tags: ['control']

seeds:
  grace_thd:
    listes:
      +schema: listes
      +column_types:
        code: varchar(254)
        libelle: varchar(254)
        definition: varchar(254)
    controls:
      +schema: seeds
      param_ctrl_fk:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          classe_cible: varchar(50)
          attribut_cible: varchar(50)
          actif: boolean
      param_ctrl_liste_valeur:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          table_liste: varchar(100)
          actif: boolean
      param_ctrl_presence_table:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          cle_primaire: varchar(50)
          conteneur_c1: varchar(1)
          conteneur_c2: varchar(1)
          conteneur_c3: varchar(1)
          conteneur_c4: varchar(1)
          actif: boolean
      param_ctrl_unicite:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          actif: boolean
      param_ctrl_remplissage:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          conteneur_c1: varchar(1)
          conteneur_c2: varchar(1)
          conteneur_c3: varchar(1)
          conteneur_c4: varchar(1)
          actif: boolean
