# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "grace_thd"
version: "1.5.0"

# This setting configures which "profile" dbt uses for this project.
profile: "grace_thd"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Crée les index sur les tables sources une seule fois en début de run, en série.
# Placé ici (et non en +pre-hook par modèle) pour éviter une race condition entre
# threads sur `CREATE INDEX IF NOT EXISTS` (non atomique sous concurrence).
# Non-bloquant (tables/colonnes absentes ignorées) et idempotent.
on-run-start:
  - "{{ create_source_indexes() }}"

vars:
  # Niveau de conteneur GRACE THD appliqué aux contrôles de remplissage
  # (valeurs attendues : C1, C2, C3, C4)
  grace_container_level: "C4"

  # SRID (système de coordonnées) des géométries. Source de vérité unique :
  # utilisé par le typage geom des modèles base/elem (macro safe_geom) ET par
  # scripts/generate_source_schema.py pour le DDL des sources.
  # 2154 = RGF93 / Lambert-93.
  grace_srid: 2154

  # Date du jeu de données source (format YYYY-MM-DD), exposée par le modèle
  # `meta_execution`. Saisie manuelle : soit ici dans le projet consommateur,
  # soit au run via `dbt run --vars '{grace_date_donnees: 2026-07-01}'`.
  # Non renseignée par défaut -> colonne date_donnees à NULL.
  grace_date_donnees: ~

  # Demi-longueur (en unités du CRS, mètres pour GRACE THD) du segment
  # généré à partir d'un point dans rapport_controles_geo_as_line.
  grace_rapport_point_line_offset: 1.0

models:
  grace_thd:
    controls:
      +schema: controles
      +materialized: table
      generique:
        +tags: ["grace_control"]
      specifique:
        +tags: ["grace_control"]
    transformations:
      +schema: transformations
      +tags: ["grace_transfo"]
      metadata:
        +materialized: table
        +tags: ["grace_meta"]
      base:
        +materialized: table
        +tags: ["grace_base"]
      elementaires:
        +materialized: view
        +tags: ["grace_elem"]
      thematiques:
        +materialized: table
        +tags: ["grace_thematiques"]
        capacite:
          +tags: ["grace_capacite"]
        ropt:
          +tags: ["grace_ropt"]
          # Vue et non table : l'agrégation par local technique se fait à la
          # volée au-dessus de ropt_json_route, en exploitant son index lc_code.
          ropt_json:
            +materialized: view
          # Désactivé : aucun modèle en aval ne le référence.
          ropt_light:
            +enabled: false
        pdb:
          +tags: ["grace_pdb"]
          # Vue et non table : l'agrégation par point de branchement se fait à
          # la volée, en exploitant les index des tables élémentaires amont.
          pdb_json:
            +materialized: view

seeds:
  grace_thd:
    listes:
      +schema: listes
      +post-hook:
        - "ALTER TABLE {{ this }} DROP CONSTRAINT IF EXISTS {{ this.identifier }}_pkey"
        - "ALTER TABLE {{ this }} ADD CONSTRAINT {{ this.identifier }}_pkey PRIMARY KEY (id)"
      +column_types:
        id: int4
        code: varchar(254)
        libelle: varchar(254)
        definition: varchar(254)
    controls:
      +schema: seeds
      param_ctrl_fk:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          classe_cible: varchar(50)
          attribut_cible: varchar(50)
          actif: boolean
      param_ctrl_liste_valeur:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          table_liste: varchar(100)
          actif: boolean
      param_ctrl_presence_table:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          cle_primaire: varchar(50)
          conteneur_c1: varchar(1)
          conteneur_c2: varchar(1)
          conteneur_c3: varchar(1)
          conteneur_c4: varchar(1)
          actif: boolean
      param_ctrl_unicite:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          actif: boolean
      param_ctrl_remplissage:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          conteneur_c1: varchar(1)
          conteneur_c2: varchar(1)
          conteneur_c3: varchar(1)
          conteneur_c4: varchar(1)
          actif: boolean
      param_ctrl_type:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          type_cible: varchar(50)
          cle_primaire: varchar(50)
          actif: boolean
          description: varchar(254)
      param_ctrl_topo:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          conteneur_c1: varchar(1)
          conteneur_c2: varchar(1)
          conteneur_c3: varchar(1)
          conteneur_c4: varchar(1)
          actif: boolean
          description: varchar(254)
      param_ctrl_metier:
        +column_types:
          id_test: varchar(50)
          classe: varchar(50)
          attribut: varchar(50)
          cle_primaire: varchar(50)
          conteneur_c1: varchar(1)
          conteneur_c2: varchar(1)
          conteneur_c3: varchar(1)
          conteneur_c4: varchar(1)
          actif: boolean
          description: varchar(254)
