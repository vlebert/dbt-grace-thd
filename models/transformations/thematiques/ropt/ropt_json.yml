version: 2

models:
  - name: ropt_json
    description: |
      Fiche JSON par local technique de départ des routes optiques.

      Double niveau d'agrégation :
        1. Une ligne par local technique amont (section de départ, `ropt_ordr = 0`).
        2. Pour chaque ligne, une colonne `json_data` (tableau JSONB) listant les
           routes optiques issues de ce local. Chaque route agrège l'ensemble de
           ses sections (`ropt_section`) pour un `ropt_id` dans un sous-tableau
           `sections`, et porte la synthèse PTO/PBO de la route.

      Adapté du legacy `v_ropt_json` (SQLite) vers PostgreSQL :
      `json_group_array(json_object(...))` → `jsonb_agg(jsonb_build_object(...))`.
      Ajoute le regroupement par local technique de départ, absent du legacy.

      **Dépendances** : ropt_section
    config:
      tags: ['grace_thematiques', 'grace_ropt']
    columns:
      - name: id
        description: Clé primaire technique régénérée via row_number()
        data_type: int4

      - name: lc_code
        description: Code du local technique de départ
        data_type: varchar(254)

      - name: lc_codeext
        description: Code externe du local technique de départ
        data_type: varchar(254)

      - name: lc_typelog
        description: Type logique du local (NRO, etc.)
        data_type: varchar(254)

      - name: lc_etage
        description: Étage du local technique de départ
        data_type: varchar(254)

      - name: json_data
        description: |
          Tableau JSONB des routes optiques issues du local technique. Chaque
          objet route contient :
          ropt_id, ropt_pto_bp_code, ropt_pto_bp_codeext, ropt_pbo_bp_code,
          ropt_pbo_bp_codeext, ropt_pbo_cs_num, ropt_pbo_ps_fonct,
          ropt_pbo_ps_numero, ropt_pbo_ps_preaff,
          et un sous-tableau `sections` (une entrée par étape de la route, triée
          par `ropt_ordr`) décrivant noeud (lc_*, bp_*, pt_*, ti_codeext, cs_num,
          ps_*) et lien (cb_*, fo_*).
        data_type: jsonb
