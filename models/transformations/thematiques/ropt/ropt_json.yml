version: 2

models:
  - name: ropt_json
    description: |
      Fiche JSON par local technique de départ des routes optiques.

      Une ligne par local technique amont (section de départ, `ropt_ordr = 0`),
      avec une colonne `json_data` (tableau JSONB) listant les routes optiques
      issues de ce local. Chaque route porte la synthèse PTO/PBO et un
      sous-tableau `sections` couvrant l'ensemble de ses étapes.

      Matérialisé en **vue** au-dessus de `ropt_json_route`, qui porte déjà les
      routes construites une à une. Une requête filtrée sur un local technique
      (`WHERE lc_code = '...'`) reste rapide : le prédicat est poussé sous le
      GROUP BY et seules les routes du local concerné sont agrégées.

      Adapté du legacy `v_ropt_json` (SQLite) vers PostgreSQL :
      `json_group_array(json_object(...))` → `jsonb_agg(jsonb_build_object(...))`.
      Ajoute le regroupement par local technique de départ, absent du legacy.

      **Dépendances** : ropt_json_route
    config:
      tags: ['grace_thematiques', 'grace_ropt']
    columns:
      - name: id
        description: Identifiant technique repris de `ropt_json_route` (MIN par local)
        data_type: int4

      - name: lc_code
        description: Code du local technique de départ
        data_type: varchar(254)

      - name: lc_codeext
        description: Code externe du local technique de départ
        data_type: varchar(254)

      - name: lc_etiquet
        description: Étiquette du local technique de départ
        data_type: varchar(20)

      - name: lc_typelog
        description: Type logique du local (NRO, etc.)
        data_type: varchar(254)

      - name: lc_etage
        description: Étage du local technique de départ
        data_type: varchar(254)

      - name: sro_lc_code
        description: |
          Code du local si celui-ci est un SRO (`t_zsro.zs_lc_code`), sinon NULL
          (y compris si le local de départ est un NRO).
        data_type: varchar(254)

      - name: sro_lc_codeext
        description: Code externe du SRO (NULL si le local de départ n'est pas un SRO)
        data_type: varchar(254)

      - name: sro_lc_etiquet
        description: Étiquette du SRO (NULL si le local de départ n'est pas un SRO)
        data_type: varchar(20)

      - name: nro_lc_code
        description: |
          Code du local NRO rattaché : le local de départ lui-même s'il est un
          NRO (`t_znro.zn_lc_code`), sinon le NRO retrouvé via la zone arrière
          du SRO de départ (`t_zsro.zs_zn_code` -> `t_znro.zn_code`).
        data_type: varchar(254)

      - name: nro_lc_codeext
        description: Code externe du NRO rattaché
        data_type: varchar(254)

      - name: nro_lc_etiquet
        description: Étiquette du NRO rattaché
        data_type: varchar(20)

      - name: json_data
        description: |
          Tableau JSONB des routes optiques issues du local technique. Chaque
          objet route contient :
          ropt_id, ropt_pto_bp_code, ropt_pto_bp_codeext, ropt_pto_bp_etiquet,
          ropt_pbo_bp_code, ropt_pbo_bp_codeext, ropt_pbo_bp_etiquet,
          ropt_pbo_cs_num, ropt_pbo_ps_fonct, ropt_pbo_ps_numero,
          ropt_pbo_ps_preaff,
          et un sous-tableau `sections` (une entrée par étape de la route, triée
          par `ropt_ordr`) décrivant noeud (lc_*, bp_*, pt_*, ti_*, cs_num,
          ps_*) et lien (cb_*, fo_*).
        data_type: jsonb
