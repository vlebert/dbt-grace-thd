version: 2

models:
  - name: elem_cs
    description: UNION ALL de elem_cs_bp et elem_cs_ti. Regroupe toutes les cassettes avec leur géométrie (via EBP ou via Tiroir). Matérialisé en table avec PK et index (repris de t_cassette).
    config:
      tags: ["grace_elem"]
      schema: transformations
      materialized: table
    columns:
      - name: id
        description: Clé primaire technique régénérée via row_number() (les id issus de t_cassette peuvent se recouvrir entre les deux branches de l'UNION).
        tests:
          - not_null
          - unique

      - name: cs_code
        description: "Code unique de la cassette (ou du module dans un tiroir)."
      - name: cs_bp_code
        description: "Identifiant unique de l'EBP auquel appartient la cassette"
      - name: cs_num
        description: "Numéro de la cassette (ou du module dans un tiroir) dans l'organiseur du BPE."
      - name: cs_type
        description: "Type de cassette (ou du module dans un tiroir) dans un tiroir (SOUDURE, LOVAGE, SPLITTER, CONNECTEUR, …etc.)"
      - name: cs_face
        description: "Face du BPE sur laquelle est enfichée la cassette/le module dans un tiroir"
      - name: cs_rf_code
        description: "Identifiant unique dans la table référence."

      - name: geom
        description: "Géométrie de l'EBP ou du tiroir associé (POINT)"
