version: 2

models:
  - name: elem_cs_ti
    description: Projette t_cassette avec géométrie de elem_ti_ba_lc_st_nd via t_position. INNER JOIN sur ps_cs_code et ps_ti_code, filtrage WHERE cs_bp_code IS NULL OR cs_bp_code <> ''. DISTINCT pour éviter les doublons.
    config:
      tags: ["grace_elem"]
      schema: transformations
    columns:
      - name: id
        description: Clé primaire technique pour QGIS
        tests:
          - not_null
          - unique

      - name: cs_code
        description: "Code unique de la cassette (ou du module dans un tiroir)."
      - name: cs_bp_code
        description: "Identifiant unique de l'EBP auquel appartient la cassette (NULL pour ces cassettes)"
      - name: cs_num
        description: "Numéro de la cassette (ou du module dans un tiroir) dans l'organiseur du BPE."
      - name: cs_type
        description: "Type de cassette (ou du module dans un tiroir) dans un tiroir (SOUDURE, LOVAGE, SPLITTER, CONNECTEUR, …etc.)"
      - name: cs_face
        description: "Face du BPE sur laquelle est enfichée la cassette/le module dans un tiroir"
      - name: cs_rf_code
        description: "Identifiant unique dans la table référence."

      - name: geom
        description: "Géométrie du tiroir associé (POINT)"
