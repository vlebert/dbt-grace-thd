version: 2
sources:
  - name: gracethd
    schema: gracethd_source
    tables:
      - name: t_position
        description: "Smoove lorsque la position appartient à une cassette, corps de traversée lorsque la position appartient à un tiroir ou une tête optique."
        columns:
          - name: ps_code
            description: "Code unique."
          - name: ps_1
            description: "Code unique de la fibre en entrée de la cassette.(pour continuité route optique)"
          - name: ps_2
            description: "Code unique de la fibre en sortie de la cassette.(pour continuité route optique)"
          - name: ps_numero
            description: "Position (numéro de compartiment) du smoove ou du connecteur"
          - name: ps_cs_code
            description: "Identifiant unique de la CASSETTE à laquelle appartient la position. (le cas échéant)"
          - name: ps_type
            description: "Type de connecteur / soudure."
          - name: ps_fonct
            description: "Type de connectorisation (Connecteur, epissure, pigtail, ….)"
          - name: ps_preaff
            description: "Pré-affectation de la route optique au local client de l'IP, ou de l'IPE ou à l'Infrastructure d'Imbrication."
          - name: ps_ti_code
            description: "Identifiant unique du TIROIR / de la TCOP à laquelle appartient la position. (cas échéant)"
