version: 2

models:
  - name: rapport_controles
    description: >
      Rapport consolidé de tous les contrôles déclarés dans `grace_ctrl_models`
      et `grace_ctrl_models_ext`. Pas de géométrie : utiliser
      rapport_controles_geo pour la restitution SIG.
    columns:
      - name: id_test
      - name: type_controle
      - name: description
      - name: classe
      - name: attribut
      - name: id_entite
      - name: detail_erreur

  - name: rapport_controles_geo
    description: >
      rapport_controles enrichi d'une colonne geom résolue par (classe,
      id_entite). Adapté à la consommation par QGIS pour localiser les erreurs.
    columns:
      - name: id_test
      - name: type_controle
      - name: description
      - name: classe
      - name: attribut
      - name: id_entite
      - name: detail_erreur
      - name: geom

  - name: synthese_erreurs_par_controle
    description: Synthèse du nombre d'erreurs par point de contrôle
    columns:
      - name: id_test
        description: Identifiant unique du contrôle
      - name: type_controle
        description: Type de contrôle
      - name: description
        description: Libellé du contrôle
      - name: classe
        description: Table GRACE THD concernée
      - name: attribut
        description: Attribut contrôlé
      - name: nombre_erreurs
        description: Nombre total d'erreurs pour ce contrôle

seeds:
  - name: param_ctrl_presence_table
    description: >
      Paramétrage du contrôle de présence des tables GRACE THD. Une ligne par
      table, avec le caractère obligatoire (O), conditionnel (C) ou absent (N)
      par niveau de conteneur, et la clé primaire de la table.
    columns:
      - name: id_test
      - name: classe
      - name: cle_primaire
      - name: conteneur_c1
      - name: conteneur_c2
      - name: conteneur_c3
      - name: conteneur_c4
      - name: actif

  - name: param_ctrl_remplissage
    description: >
      Paramétrage du contrôle générique de remplissage. Une ligne par couple
      (classe, attribut) à contrôler. La colonne `conteneur_cX` indique le
      caractère obligatoire (O), conditionnel (C) ou absent (N) au niveau de
      conteneur X.
    columns:
      - name: id_test
      - name: classe
      - name: attribut
      - name: cle_primaire
      - name: conteneur_c1
      - name: conteneur_c2
      - name: conteneur_c3
      - name: conteneur_c4
      - name: actif

  - name: param_ctrl_unicite
    description: >
      Paramétrage du contrôle générique d'unicité. Une ligne par attribut
      à vérifier pour l'unicité dans sa table.
    columns:
      - name: id_test
      - name: classe
      - name: attribut
      - name: cle_primaire
      - name: actif

  - name: param_ctrl_fk
    description: >
      Paramétrage du contrôle générique de clés étrangères. Une ligne par
      relation FK à vérifier entre (classe, attribut) et (classe_cible,
      attribut_cible).
    columns:
      - name: id_test
      - name: classe
      - name: attribut
      - name: cle_primaire
      - name: classe_cible
      - name: attribut_cible
      - name: actif

  - name: param_ctrl_liste_valeur
    description: >
      Paramétrage du contrôle générique de conformité aux listes de valeurs.
      Une ligne par couple (classe, attribut) à vérifier contre un référentiel
      l_* (colonne `code`).
    columns:
      - name: id_test
      - name: classe
      - name: attribut
      - name: cle_primaire
      - name: table_liste
      - name: actif
