version: 2

models:
  - name: topo_0010_t_cable_start_cheminement_exists
    description: |
      Vérifie l'existence d'au moins un cheminement connecté au noeud de départ
      (cb_nd1) pour chaque câble dont le type logique n'est pas RACCORDEMENT.
      Un cheminement est considéré connecté si cb_nd1 = cm_ndcode1 ou cm_ndcode2.
    config:
      tags: ['control', 'topologie']
