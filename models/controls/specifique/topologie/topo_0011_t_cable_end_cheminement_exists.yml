version: 2

models:
  - name: topo_0011_t_cable_end_cheminement_exists
    description: |
      Verifie l'existence d'au moins un cheminement connecte au poste d'arrivee
      (cb_nd2) pour chaque cable dont le type logique n'est pas RACCORDEMENT.
      Un cheminement est considere connecte si cb_nd2 = cm_ndcode1 ou cm_ndcode2.
    config:
      tags: ["control", "topologie"]
