version: 2

models:
  - name: ctrl_presence_table
    description: >
      Contrôle de présence et de vacuité des tables obligatoires GRACE THD.
      Signale les tables absentes du schéma source et les tables présentes mais
      vides, pour le niveau de conteneur courant. Paramétré par
      `param_ctrl_presence_table`.
    columns:
      - name: id_test
      - name: type_controle
      - name: description
      - name: classe
      - name: attribut
      - name: id_entite
      - name: detail_erreur

  - name: ctrl_remplissage
    description: >
      Contrôle générique de remplissage des attributs obligatoires. Une ligne
      par entité dont un attribut déclaré obligatoire au niveau de conteneur
      courant est NULL ou vide. Paramétré par `param_ctrl_remplissage`.
    columns:
      - name: id_test
      - name: type_controle
      - name: description
      - name: classe
      - name: attribut
      - name: id_entite
      - name: detail_erreur

  - name: ctrl_unicite
    description: >
      Contrôle générique d'unicité des attributs. Une ligne par entité dont
      un attribut prend une valeur dupliquée dans la table. Les valeurs NULL
      ne sont pas signalées ici (géré par ctrl_remplissage). Paramétré par
      `param_ctrl_unicite`.
    columns:
      - name: id_test
      - name: type_controle
      - name: description
      - name: classe
      - name: attribut
      - name: id_entite
      - name: detail_erreur

  - name: ctrl_fk
    description: >
      Contrôle générique d'intégrité référentielle. Une ligne par entité dont
      un attribut FK est non NULL mais absent de la table cible. Les valeurs
      NULL ne sont pas signalées ici (géré par ctrl_remplissage). Paramétré
      par `param_ctrl_fk`.
    columns:
      - name: id_test
      - name: type_controle
      - name: description
      - name: classe
      - name: attribut
      - name: id_entite
      - name: detail_erreur

  - name: ctrl_liste_valeur
    description: >
      Contrôle générique de conformité aux listes de valeurs. Une ligne par
      entité dont un attribut est non NULL mais absent du référentiel l_*
      correspondant (colonne `code`). Paramétré par `param_ctrl_liste_valeur`.
    columns:
      - name: id_test
      - name: type_controle
      - name: description
      - name: classe
      - name: attribut
      - name: id_entite
      - name: detail_erreur
